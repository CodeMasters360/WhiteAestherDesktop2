name: build, test and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: whiteaesther-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AETHER_REVISION: 2409297365e23e3fd320a87c0da73d0656bee67c
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static

jobs:
  gate:
    name: Decide whether this publishes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
    steps:
      - name: Check out upstream WhiteAesther to read version
        uses: actions/checkout@v4
        with:
          repository: WhiteDNS/WhiteAesther

      - id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          prerelease="$(node -p "require('./package.json').prerelease === true")"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

          publish=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            publish=true
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            if gh release view "v${version}" >/dev/null 2>&1; then
              echo "v${version} is already released; this merge changes nothing to publish"
            else
              publish=true
            fi
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "version ${version}, prerelease ${prerelease}, publish ${publish}"

  package:
    name: ${{ matrix.name }}
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x86_64
            artifact: windows-x86_64
            core: aether.exe
            bundles: nsis,msi
            packages: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi

          - os: ubuntu-22.04
            name: Linux x86_64
            artifact: linux-x86_64
            core: aether
            bundles: deb,rpm,appimage
            packages: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out WhiteAesther source from upstream
        uses: actions/checkout@v4
        with:
          repository: WhiteDNS/WhiteAesther

      - name: Check out the pinned Aether core
        uses: actions/checkout@v4
        with:
          repository: WhiteDNS/WhiteAestherMobile
          ref: ${{ env.AETHER_REVISION }}
          path: aether-source

      - name: Apply and verify the desktop core patches
        run: node scripts/prepare-core.mjs --checkout aether-source --destination aether-core

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: >-
          sudo -E apt-get update
          -o Acquire::Retries=3 -o Acquire::http::Timeout=20 &&
          sudo -E apt-get install -y
          -o Acquire::Retries=3 -o Acquire::http::Timeout=20
          libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev
          libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          cmake ninja-build perl pkg-config clang rpm libarchive-tools xdg-utils
          libevent-2.1-7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Install NASM for BoringSSL
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set the visible build version
        shell: bash
        run: |
          visible_version="$(node -p "require('./package.json').version")"
          echo "VITE_APP_VERSION=${visible_version}" >> "$GITHUB_ENV"
          echo "WhiteAesther UI version: ${visible_version}"

      - name: Compile the frontend
        run: pnpm build

      - name: Test the frontend
        run: pnpm test

      - name: Test the Aether core
        run: cargo test --locked --manifest-path "aether-core/aether/Cargo.toml" --lib -- --test-threads=1

      - name: Check core formatting
        run: cargo fmt --manifest-path "aether-core/aether/Cargo.toml" -- --check

      - name: Lint the Aether core
        run: cargo clippy --locked --manifest-path "aether-core/aether/Cargo.toml" --all-targets

      - name: Compile the Aether core
        env:
          AETHER_BUILD_REVISION: ${{ env.AETHER_REVISION }}
        run: cargo build --release --locked --manifest-path aether-core/aether/Cargo.toml

      - name: Stage the target-specific Aether sidecar
        run: pnpm stage:core -- --source "${{ github.workspace }}/aether-core/aether/target/release/${{ matrix.core }}"

      - name: Install UI test browser
        if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium --only-shell

      - name: Test rendered settings and delayed Save
        if: runner.os == 'Windows'
        env:
          WHITEAESTHER_TEST_CORE: ${{ github.workspace }}/aether-core/aether/target/release/${{ matrix.core }}
        run: pnpm test:ui

      - name: Stage the chain engine
        run: pnpm stage:chain

      - name: Install Go for the Psiphon carrier
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Stage the Psiphon carrier
        run: pnpm stage:psiphon

      - name: Stage the Worker engine
        env:
          GOTOOLCHAIN: auto
        run: pnpm stage:xray

      - name: Test the Worker script
        run: pnpm test:worker

      # اعمال درجا پچ Tor 16.0.1 و هدر اختصاصی روی stage-tor.mjs
      - name: Patch stage-tor.mjs inline
        shell: bash
        run: |
          node -e '
          const fs = require("fs");
          let content = fs.readFileSync("scripts/stage-tor.mjs", "utf8");
          // تغییر نسخه به 16.0.1
          content = content.replace(/const VERSION = "[^"]+";/, `const VERSION = "16.0.1";`);
          // تزریق هدر User-Agent به توابع fetch برای جلوگیری از ۴۰۳
          content = content.replace(/fetch\((url[^)]*)\)/g, (m, g) => `fetch(${g}, { headers: { "User-Agent": "curl/8.5.0", "Accept": "*/*" } })`);
          fs.writeFileSync("scripts/stage-tor.mjs", content, "utf8");
          console.log("Successfully patched scripts/stage-tor.mjs to Tor 16.0.1");
          '

      - name: Stage the Tor carrier
        run: pnpm stage:tor

      - name: Test the Tauri backend
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml

      - name: Build the desktop package
        env:
          NO_STRIP: "true"
        run: pnpm tauri build --verbose --bundles "${{ matrix.bundles }}"

      - name: Execute the core extracted from every package
        run: node scripts/verify-packaged-core.mjs --packages "src-tauri/target/release/bundle" --report "package-verification-${{ matrix.artifact }}.json"

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: whiteaesther-${{ matrix.artifact }}
          path: ${{ matrix.packages }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload package verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: core-verification-${{ matrix.artifact }}
          path: package-verification-${{ matrix.artifact }}.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: [gate, package]
    if: >-
      always()
      && needs.gate.outputs.publish == 'true'
      && (needs.package.result == 'success' || needs.package.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the packages built in this run
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
          pattern: whiteaesther-*

      - name: Flatten package directories
        shell: bash
        run: |
          set -euo pipefail
          before="$(find release-assets -type f | wc -l)"
          test "${before}" -gt 0 || { echo "no packages were built" >&2; exit 1; }

          mkdir flattened-assets
          while IFS= read -r -d '' package; do
            cp -- "$package" "flattened-assets/$(basename "$package")"
          done < <(find release-assets -type f -print0)
          rm -rf release-assets
          mv flattened-assets release-assets

      - name: Give every package the same naming scheme
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          version="${{ needs.gate.outputs.version }}"

          for asset in *; do
            case "$asset" in
              *-setup.exe)   named="windows_x86_64.exe" ;;
              *.msi)         named="windows_x86_64.msi" ;;
              *.deb)         named="linux_x86_64.deb" ;;
              *.rpm)         named="linux_x86_64.rpm" ;;
              *.AppImage)    named="linux_x86_64.AppImage" ;;
              *)             named="$asset" ;;
            esac
            if [ "$asset" != "WhiteAesther_${version}_${named}" ]; then
              mv -- "$asset" "WhiteAesther_${version}_${named}"
            fi
          done
          ls -1

      - name: Create installer pack and SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          zip -9 WhiteAesther-installers.zip ./*.exe ./*.msi ./*.deb ./*.rpm ./*.AppImage || true
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS

      - name: Publish the release and auto-create tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${{ needs.gate.outputs.version }}"

          # بررسی وجود تگ یا ریلیز و ساخت خودکار در صورت عدم وجود
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            flags=()
            if [[ "${{ needs.gate.outputs.prerelease }}" == "true" ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$tag" release-assets/* \
              --target "${GITHUB_SHA}" \
              --title "WhiteAesther $tag" \
              --generate-notes \
              ${flags[@]+"${flags[@]}"}
          fi
          echo "Released $tag to current repository"
